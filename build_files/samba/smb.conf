# EvenKeelOS: System Tools, Shared folders writes the shared folders to evenkeel-shares.conf.
# Only folders picked there are shared, each with a password; nothing is shared as a guest.

[global]
	workgroup = WORKGROUP
	server string = %h
	security = user
	passdb backend = tdbsam
	map to guest = Never
	restrict anonymous = 2
	server min protocol = SMB2_10
	disable netbios = yes
	server smb transports = 445
	map archive = no
	load printers = no
	printcap name = /dev/null
	disable spoolss = yes
	multicast dns register = yes
	mdns name = mdns
	vfs objects = catia fruit streams_xattr
	fruit:metadata = stream
	fruit:model = MacSamba
	fruit:posix_rename = yes
	fruit:veto_appledouble = no
	fruit:nfs_aces = no
	fruit:wipe_intentionally_left_blank_rfork = yes
	fruit:delete_empty_adfiles = yes
	include = /etc/samba/evenkeel-shares.conf
