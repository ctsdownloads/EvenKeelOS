# README and guide checks, on every change; builds nothing.
name: Check the README and the guides
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docs:
    name: Check the README and the guides
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the README and the guides
        run: python3 build_files/check-docs.py
