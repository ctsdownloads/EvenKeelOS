---
name: Build container image
on:
  # Writing-only changes build no image; docs.yml checks them.
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    - cron: '05 10 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      rollback_tests:
        description: Also run every Test automatic rollback test in a virtual machine (branches only, about 4 hours)
        type: boolean
        default: false

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      # Only main publishes; pull requests never do.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

    steps:
      # Dependabot keeps these pinned versions up to date.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 60     # the last changes' titles, for the list of changes below

      # Every shell script, found by its first line (a sourced one starts with "# shellcheck shell=bash").
      - name: Check root scripts
        run: |
          git ls-files -z | while IFS= read -r -d '' f; do
            if head -n1 "$f" | grep -qE '^(#!/(usr/)?bin/(env )?(ba)?sh|# shellcheck shell=bash)'; then printf '%s\0' "$f"; fi
          done | xargs -0 shellcheck -x -s bash -S warning
          cd build_files
          pipx run --spec bandit==1.9.4 bandit -q -ll evenkeel-os-tools-admin evenkeel-os-tools-safe evenkeel-os-hwrules \
            evenkeel-os-vpn evenkeel-os-app-updates check-root-helpers.py check-vpns.py greenboot/evenkeel-os-settings \
            check-settings-repair.py greenboot/evenkeel-os-settings-test evenkeel-os-cert-remove evenkeel-os-certs \
            check-locked-versions.py evenkeel-os-boot-options evenkeel_os_health.py greenboot/evenkeel-os-health \
            check-health.py

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      # Last 60 change titles for System Update's what's new, leaving out bot and version-check upkeep.
      - name: List of changes
        run: |
          git log -60 --format='%cs%x09%s' --perl-regexp --author='^(?!(dependabot|github-actions)\[bot\])' \
            --invert-grep --grep='^Update locked versions' > build_files/changes.txt

      # A locked version of Dash to Panel, ArcMenu, Logo Menu, Bazaar or Ghostty with untranslated text stops the build.
      - name: The outside apps' text is translated
        run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends gettext rpm2cpio cpio jq
          build_files/check-app-texts.sh

      # Windows Program's downloads; a site that is down falls back to the copy saved by the last build.
      - name: Restore saved Windows Program downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build_files/windows-data
          key: windows-data-${{ github.run_id }}
          restore-keys: windows-data-

      - name: Download Windows Program data
        run: build_files/fetch-windows-data.sh build_files/windows-data

      - name: Save Windows Program downloads
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build_files/windows-data
          key: windows-data-${{ github.run_id }}

      # Registry addresses must be lowercase: https://github.com/macbre/push-to-ghcr/issues/12
      - name: Image name and tag
        run: |
          . ./image-template.env
          { echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}"; echo "IMAGE_NAME=${IMAGE_NAME,,}"
            echo "DEFAULT_TAG=${DEFAULT_TAG}"; } >> "$GITHUB_ENV"

      - name: Build Image
        run: |
          just build "${IMAGE_NAME}" "${DEFAULT_TAG}"

      # Smaller delta updates.
      - name: Rechunk with rpm-ostree
        run: |
          just ostree-rechunk "${IMAGE_NAME}" "${DEFAULT_TAG}"

      # Start the new image in a virtual machine first; nothing is published unless it reaches the desktop.
      - name: Boot test
        id: boot-test
        timeout-minutes: 100
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf socat
          boot_test/run-boot-test.sh "localhost/${IMAGE_NAME}:${DEFAULT_TAG}"

      - name: Save the boot test results
        if: always() && steps.boot-test.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-test
          path: ${{ runner.temp }}/boot-test-results/
          if-no-files-found: ignore

      # Asked for on a branch only, so they never hold up a published build.
      - name: Rollback tests
        id: rollback-tests
        if: inputs.rollback_tests && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        timeout-minutes: 300
        run: boot_test/run-rollback-tests.sh

      - name: Save the rollback test results
        if: always() && steps.rollback-tests.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rollback-test
          path: ${{ runner.temp }}/rollback-test-results/
          if-no-files-found: ignore

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          echo "alias_tags=$(just generate-build-tags "${IMAGE_NAME}" "${DEFAULT_TAG}")" >> "$GITHUB_OUTPUT"

      - name: Tag Image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images "${IMAGE_NAME}" "${DEFAULT_TAG}" "${ALIAS_TAGS}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: env.PUBLISH == 'true'
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile=/tmp/digestfile "${IMAGE_NAME}:${tag}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done
          echo "digest=$(< /tmp/digestfile)" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: env.PUBLISH == 'true'
        with:
          cosign-release: 'v3.1.2'

      - name: Sign container image
        if: env.PUBLISH == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # old bundle format: rpm-ostree can't read the new one (container-libs#388, rpm-ostree#5509)
          cosign sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

  # A failed main or daily build opens an issue assigned to the owner; the next good build closes it.
  alert:
    name: Alert on a failed build
    needs: build_push
    if: >-
      always() && github.event_name != 'pull_request'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && contains(fromJSON('["success", "failure"]'), needs.build_push.result)
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULT: ${{ needs.build_push.result }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: The image build failed
      OWNER: ctsdownloads
    steps:
      - name: Open, update or close the issue
        run: |
          issue=$(gh issue list --state open --search "in:title \"$TITLE\"" --limit 100 --json number,title \
            -q "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ "$RESULT" = failure ]; then
            body="@$OWNER the image build failed. Installed computers keep the last good build until it is fixed. $RUN"
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "Failed again. $body"
            else
              gh issue create --title "$TITLE" --assignee "$OWNER" --body "$body"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "The image build works again. $RUN"
          fi
